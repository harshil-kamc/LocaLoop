<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Localoop - Leaderboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <link rel="stylesheet" href="dashboard.css">
    <style>
        /* Keep your existing leaderboard styles */
        .leaderboard-container {
            max-width: 800px;
            margin: 100px auto 40px; /* Increased top margin for the header */
            padding: 20px;
        }
        .top-three {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 20px;
            margin-bottom: 40px;
            padding-top: 50px;
        }
        .podium-item {
            text-align: center;
            background: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: var(--shadow-subtle);
            width: 180px;
            position: relative;
        }
        .podium-item.rank-1 { height: 220px; border: 2px solid #ffd700; transform: scale(1.1); z-index: 2; }
        .podium-item.rank-2 { height: 180px; border: 2px solid #c0c0c0; }
        .podium-item.rank-3 { height: 160px; border: 2px solid #cd7f32; }
        
        .crown { position: absolute; top: -30px; left: 50%; transform: translateX(-50%); font-size: 30px; color: #ffd700; }
        
        .leaderboard-table {
            background: white;
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow-float);
        }
        .leader-row {
            display: grid;
            grid-template-columns: 60px 1fr 120px 100px;
            padding: 16px 24px;
            align-items: center;
            border-bottom: 1px solid #f1f5f9;
            transition: var(--transition);
        }
        .leader-row:hover { background: #f8fafc; }
        .leader-row.me { background: rgba(79, 70, 229, 0.05); border-left: 4px solid var(--brand); }
        
        .rank-num { font-weight: 700; color: var(--text-muted); }
        .user-info { display: flex; align-items: center; gap: 12px; }
        .user-avatar { width: 35px; height: 35px; background: #e2e8f0; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 600; }
        .points { font-weight: 700; color: var(--brand); text-align: right; }
        .badge-pill { font-size: 11px; padding: 4px 8px; border-radius: 20px; background: #f1f5f9; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
    </style>
</head>
<body style="background: #f8fafc; overflow-y: auto;">

    <header class="top-nav">
        <div class="brand">
            <button class="icon-btn" onclick="toggleSideMenu()" style="background: var(--brand); color: white;">
                <i class="fas fa-bars"></i>
            </button>
            <i class="fas fa-layer-group" style="font-size: 22px; margin-left: 10px;"></i> 
            <span style="margin-left: 8px; font-weight: 700;">Localoop</span>
        </div>
        <div class="nav-actions">
            <div class="user-chip">
                <div style="width: 24px; height: 24px; border-radius: 50%; background: var(--brand); color: white; display: flex; align-items: center; justify-content: center; font-size: 10px;"><i class="fas fa-user"></i></div>
                <span id="profileName">Loading...</span>
            </div>
            <button class="icon-btn" onclick="performLogout()" style="color: var(--danger);"><i class="fas fa-power-off"></i></button>
        </div>
    </header>

    <div id="sideMenuOverlay" class="modal-overlay" onclick="toggleSideMenu()"></div>
    <aside class="side-menu" id="sideMenu">
        <div class="panel-header" style="display: flex; justify-content: space-between; align-items: center;">
            <h2 style="margin:0;">Menu</h2>
            <button class="icon-btn" onclick="toggleSideMenu()"><i class="fas fa-times"></i></button>
        </div>
        <div style="padding: 24px; text-align: center; border-bottom: 1px solid rgba(0,0,0,0.05);">
            <div style="width: 64px; height: 64px; border-radius: 50%; background: var(--brand); color: white; display: flex; align-items: center; justify-content: center; font-size: 24px; margin: 0 auto 12px;"><i class="fas fa-user"></i></div>
            <h3 id="menuProfileName" style="margin-bottom: 4px;">Loading...</h3>
            <span class="status-badge status-resolved" id="menuProfileRole">Resident</span>
        </div>
        <div style="padding: 20px;">
            <div class="nav-item" onclick="window.location.href='dashboard.html'"><i class="fas fa-map"></i> Live Map</div>
            <div class="nav-item" onclick="window.location.href='reports.html'"><i class="fas fa-list-alt"></i> Issues Reported</div>
            <div class="nav-item active"><i class="fas fa-trophy"></i> Leaderboard</div>
            <div class="nav-item" onclick="window.location.href='settings.html'"><i class="fas fa-cog"></i> Settings</div>
        </div>
    </aside>

    <div class="leaderboard-container">
        <div style="text-align: center; margin-bottom: 30px;">
            <h2 style="font-size: 28px; color: var(--text-main);">City Impact Leaderboard</h2>
            <p style="color: var(--text-muted);">Top citizens making a difference</p>
        </div>

         <div class="top-three" id="podiumContainer"></div>

        <div class="leaderboard-table" id="leaderboardList">
            <div class="leader-row" style="background: #f8fafc; font-weight: 600; font-size: 12px; color: var(--text-muted);">
                <span>RANK</span>
                <span>CITIZEN</span>
                <span>IMPACT POINTS</span>
                <span>STATUS</span>
            </div>
        </div>
    </div>

        <div class="leaderboard-table" id="leaderboardList">
            <div class="leader-row" style="background: #f8fafc; font-weight: 600; font-size: 12px; color: var(--text-muted);">
                <span>RANK</span>
                <span>CITIZEN</span>
                <span>IMPACT POINTS</span>
                <span>STATUS</span>
            </div>
        </div>
    </div>

    <script>
        // SIDE MENU LOGIC
        function toggleSideMenu() {
            document.getElementById('sideMenu').classList.toggle('show');
            document.getElementById('sideMenuOverlay').classList.toggle('show');
        }

        function performLogout() {
            localStorage.removeItem('civicUser');
            window.location.href = 'index.html';
        }

        // LEADERBOARD DATA
        const leaders = [
            { name: "Arjun Reddy", points: 1450, email: "arjun@example.com", role: "Guardian" },
            { name: "Priya Sharma", points: 1200, email: "priya@example.com", role: "Active Citizen" },
            { name: "Suresh Kumar", points: 980, email: "suresh@example.com", role: "Contributor" },
            { name: "Ananya Singh", points: 850, email: "ananya@example.com", role: "Contributor" },
            { name: "Rahul Varma", points: 720, email: "rahul@example.com", role: "Resident" },
        ];

        document.addEventListener('DOMContentLoaded', () => {
            const currentUser = JSON.parse(localStorage.getItem('civicUser'));
            if(currentUser) {
                // Update header and menu names
                document.getElementById('profileName').textContent = currentUser.name;
                document.getElementById('menuProfileName').textContent = currentUser.name;
                document.getElementById('menuProfileRole').textContent = currentUser.role || 'Resident';

                if(!leaders.find(l => l.email === currentUser.email)) {
                    leaders.push({ name: currentUser.name, points: 450, email: currentUser.email, role: currentUser.role || "Resident" });
                }
            }

            leaders.sort((a, b) => b.points - a.points);
            renderLeaderboard(leaders, currentUser);
        });

       function renderLeaderboard(data, me) {
            const list = document.getElementById('leaderboardList');
            const podium = document.getElementById('podiumContainer');

            podium.innerHTML = `
                <div class="podium-item rank-2">
                    <div class="user-avatar" style="margin: 0 auto 10px; width: 50px; height: 50px;">${data[1].name[0]}</div>
                    <div style="font-weight:700;">${data[1].name}</div>
                    <div class="points">${data[1].points} pts</div>
                    <div class="badge-pill">2nd Place</div>
                </div>
                <div class="podium-item rank-1">
                    <i class="fas fa-crown crown"></i>
                    <div class="user-avatar" style="margin: 0 auto 10px; width: 60px; height: 60px; background:var(--brand); color:white;">${data[0].name[0]}</div>
                    <div style="font-weight:700;">${data[0].name}</div>
                    <div class="points">${data[0].points} pts</div>
                    <div class="badge-pill" style="background:rgba(79,70,229,0.1); color:var(--brand);">City Hero</div>
                </div>
                <div class="podium-item rank-3">
                    <div class="user-avatar" style="margin: 0 auto 10px; width: 50px; height: 50px;">${data[2].name[0]}</div>
                    <div style="font-weight:700;">${data[2].name}</div>
                    <div class="points">${data[2].points} pts</div>
                    <div class="badge-pill">3rd Place</div>
                </div>
            `;

            data.forEach((user, index) => {
                const isMe = user && me && user.email === me.email;
                const row = document.createElement('div');
                row.className = `leader-row ${isMe ? 'me' : ''}`;
                row.innerHTML = `
                    <span class="rank-num">#${index + 1}</span>
                    <div class="user-info">
                        <div class="user-avatar">${user.name[0]}</div>
                        <div>
                            <div style="font-weight:600;">${user.name} ${isMe ? '(You)' : ''}</div>
                            <div style="font-size:11px; color:var(--text-muted);">${user.role}</div>
                        </div>
                    </div>
                    <span class="points">${user.points.toLocaleString()}</span>
                    <div><span class="badge-pill">${user.points > 1000 ? 'Elite' : 'Pro'}</span></div>
                `;
                list.appendChild(row);
            });
        }

    </script>
</body>
</html>
