<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Reports - Localoop</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <link rel="stylesheet" href="dashboard.css">
    <link rel="stylesheet" href="/assets/localoop-loader.css" />
    <script src="/assets/localoop-brand.js"></script>

    <style>
        /* --- GLOBAL STYLES --- */
        body {
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 20px 20px;
            background-color: #f1f5f9;
            font-family: 'Inter', sans-serif;
            transition: background 0.3s ease;
        }

        /* --- FOCUS MODE: HIDE INTERFACE --- */
        body.modal-active .top-nav, 
        body.modal-active .side-menu,
        body.modal-active .reports-container {
            display: none !important;
        }

        body.modal-active {
            background-color: #f8fafc;
            background-image: none;
            overflow: hidden; 
        }

        /* --- REPORTS CONTAINER & GRID --- */
        .reports-container {
            position: absolute;
            top: 100px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 1000px;
            bottom: 30px;
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            border: var(--glass-border);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-float);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            z-index: 10;
        }

        .reports-grid {
            padding: 24px;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        /* --- MODAL & OVERLAY --- */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(8px);
            z-index: 999;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.show {
            display: flex;
        }

        .details-modal {
            background: white;
            padding: 32px;
            border-radius: 24px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            position: relative;
            border: none;
        }

        .modal-header h3 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #1e293b;
            margin: 0;
        }

        .modal-body p {
            color: #64748b;
            line-height: 1.6;
            margin: 12px 0;
            font-size: 14.5px;
        }

        /* --- RESOLUTION CARD --- */
        .resolution-card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 20px;
            margin-top: 24px;
        }

        .resolution-card h4 {
            margin: 0 0 12px 0;
            color: #0f172a;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .styled-textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            resize: none;
            font-family: inherit;
            font-size: 14px;
            margin-bottom: 12px;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        .styled-textarea:focus {
            outline: none;
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .file-input-label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            color: #64748b;
            margin-bottom: 6px;
        }

        /* --- BUTTONS --- */
        .btn-submit {
            background: #4f46e5;
            color: white;
            font-weight: 600;
            padding: 14px;
            border-radius: 12px;
            border: none;
            width: 100%;
            cursor: pointer;
            font-size: 15px;
            transition: all 0.2s;
        }

        .btn-submit:hover { background: #4338ca; transform: translateY(-1px); }

        .btn-close-flat {
            background: transparent;
            color: #64748b;
            font-weight: 500;
            padding: 10px;
            border-radius: 12px;
            border: none;
            width: 100%;
            margin-top: 10px;
            cursor: pointer;
            font-size: 14px;
        }

        .btn-close-flat:hover { background: #f1f5f9; color: #1e293b; }
    </style>
</head>
<body>

    <script>
    (function() {
        const user = JSON.parse(localStorage.getItem('civicUser'));
        if (!user || !user.name || !user.email) {
            window.location.replace('index.html');
        }
    })();
    </script>

    <header class="top-nav">
        <div class="brand">
            <button class="icon-btn" onclick="toggleSideMenu()" style="background: var(--brand); color: white;"><i class="fas fa-bars"></i></button>
            <a href="dashboard.html" style="text-decoration: none; color: inherit; font-size: 19px; font-weight: 800; letter-spacing: -0.5px; display: inline-flex; align-items: center; gap: 8px; margin-left: 6px;">
                Localoop <span class="gov-tag" style="background: #e2e8f0; color: #1e293b; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; border: 1px solid #cbd5e1;">Gov</span>
            </a>
        </div>
        <div class="nav-actions">
            <div class="user-chip">
                <div style="width: 24px; height: 24px; border-radius: 50%; background: var(--brand); color: white; display: flex; align-items: center; justify-content: center; font-size: 10px;"><i class="fas fa-user"></i></div>
                <span id="profileName">Loading...</span>
            </div>
            <button class="icon-btn" id="signOutBtn" onclick="performLogout()" title="Sign Out" aria-label="Sign Out" style="color: var(--danger);"><i class="fas fa-power-off"></i></button>
        </div>
    </header>

    <div id="sideMenuOverlay" class="modal-overlay" onclick="toggleSideMenu()"></div>
    <aside class="side-menu" id="sideMenu">
        <div class="panel-header" style="display: flex; justify-content: space-between; align-items: center;">
            <h2 style="margin:0;">Menu</h2>
            <button class="icon-btn" onclick="toggleSideMenu()"><i class="fas fa-times"></i></button>
        </div>
        <div style="padding: 24px; text-align: center; border-bottom: 1px solid rgba(0,0,0,0.05);">
            <div style="width: 64px; height: 64px; border-radius: 50%; background: var(--brand); color: white; display: flex; align-items: center; justify-content: center; font-size: 24px; margin: 0 auto 12px;"><i class="fas fa-user"></i></div>
            <h3 id="menuProfileName" style="margin-bottom: 4px;">Loading...</h3>
            <span class="status-badge status-resolved" id="menuProfileRole">Gov Official</span>
        </div>
        <div style="padding: 20px;">
            <div class="nav-item" onclick="window.location.href='dashboard.html'"><i class="fas fa-map"></i> Live Map</div>
            <div class="nav-item active" onclick="window.location.href='reports.html'"><i class="fas fa-list-alt"></i> Issue Reports</div>
            <div class="nav-item" onclick="window.location.href='leaderboard.html'"><i class="fas fa-trophy"></i> Leaderboard</div>
            <div class="nav-item" onclick="window.location.href='settings.html'"><i class="fas fa-cog"></i> Settings</div>
            <div class="nav-item" id="sideMenuSignOut" onclick="performLogout()" style="color: var(--danger); margin-top: 16px; border-top: 1px solid rgba(0,0,0,0.06); padding-top: 14px; cursor: pointer;"><i class="fas fa-sign-out-alt"></i> Sign Out</div>
        </div>
    </aside>

    <main class="reports-container">
        <div class="panel-header" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px;">
            <div>
                <h2>Reported Issues In Your Locality</h2>
                <p style="color: var(--text-muted); font-size: 14px;">Track and resolve civic issues.</p>
            </div>
            <div class="filter-group">
                <button class="filter-pill active" onclick="applyFilter('all', this)">All</button>
                <button class="filter-pill" onclick="applyFilter('pending', this)">Pending</button>
                <button class="filter-pill" onclick="applyFilter('resolved', this)">Resolved</button>
            </div>
        </div>
        <div class="reports-grid" id="myReportsGrid"></div>
    </main>

    <div id="detailsModalOverlay" class="modal-overlay" onclick="closeDetails()">
        <div class="details-modal" onclick="event.stopPropagation()">
            <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px;">
                <div class="modal-header">
                    <h3 id="modalTitle">Issue Details</h3>
                    <span id="modalStatusBadge" class="status-badge" style="margin-top: 8px; display: inline-block;"></span>
                </div>
                <button class="icon-btn" onclick="closeDetails()"><i class="fas fa-times"></i></button>
            </div>

            <div class="modal-body">
                <p><strong><i class="far fa-calendar-alt" style="width: 18px;"></i> Reported:</strong> <span id="modalDate"></span></p>
                <p><strong><i class="fas fa-info-circle" style="width: 18px;"></i> Description:</strong><br>
                   <span id="modalDescription" style="display: block; margin-top: 6px; color: #475569;"></span>
                </p>
            </div>

            <div id="resolutionSection" class="resolution-card" style="display: none;">
                <h4><i class="fas fa-tools" style="color: #4f46e5;"></i> Submit Resolution</h4>
                <form id="resolveForm" onsubmit="handleResolveSubmit(event)">
                    <textarea id="resolveDesc" class="styled-textarea" rows="3" placeholder="Explain the steps taken to fix this..." required></textarea>
                    
                    <div class="file-input-wrapper" style="margin-bottom: 20px;">
                        <label class="file-input-label" for="resolveImage">Upload Completion Photo</label>
                        <input type="file" id="resolveImage" accept="image/*" required style="font-size: 13px; color: #64748b;">
                    </div>

                    <button type="submit" class="btn-submit">Confirm & Resolve Issue</button>
                </form>
            </div>

            <button class="btn-close-flat" onclick="closeDetails()">Close Window</button>
        </div>
    </div>

    <script>
        let state = {
            currentUser: JSON.parse(localStorage.getItem('civicUser')),
            issues: [],
            activeFilter: 'all',
            currentIssueId: null
        };

        function isDemoAccount(email) {
            if (!email) return false;
            const lower = String(email).trim().toLowerCase();
            return lower === 'official@city.gov' || lower === 'citizen@localoop.org' || lower.endsWith('@demo.localoop.org');
        }

        async function fetchIssues() {
            try {
                const user = state.currentUser || {};
                const userEmail = user.email ? encodeURIComponent(user.email) : '';
                const response = await fetch(`/api/issues?userEmail=${userEmail}`, {
                    headers: { 'x-user-email': user.email || '' }
                });
                if (response.ok) {
                    let allIssues = await response.json();
                    const isDemo = isDemoAccount(user.email);
                    if (!isDemo) {
                        allIssues = allIssues.filter(r => 
                            !r.isDemo && 
                            !String(r.id).startsWith('iss_') && 
                            r.reporterEmail !== 'citizen@localoop.org' && 
                            r.reporterEmail !== 'official@city.gov'
                        );
                    }
                    state.issues = allIssues;
                    renderReports(state.activeFilter);
                }
            } catch (err) {
                console.error("Failed to fetch reports:", err);
            }
        }

        function renderReports(filter = 'all') {
            const grid = document.getElementById('myReportsGrid');
            if (!grid) return;
            grid.innerHTML = ''; 

            const filteredReports = state.issues.filter(report => {
                return (filter === 'all' || report.status.toLowerCase() === filter.toLowerCase());
            });

            if (filteredReports.length === 0) {
                grid.innerHTML = `<p style="color: var(--text-muted); grid-column: 1 / -1; text-align: center; padding: 40px;">No ${filter} issues found.</p>`;
                return;
            }

            filteredReports.forEach(report => {
                const isResolved = report.status.toLowerCase() === 'resolved';
                const statusClass = isResolved ? 'status-resolved' : 'status-pending';
                const statusText = report.status.charAt(0).toUpperCase() + report.status.slice(1);
                const displayDate = report.createdAt ? new Date(report.createdAt).toLocaleDateString() : 'Recent';
                const photos = Array.isArray(report.images) && report.images.length > 0 ? report.images : (Array.isArray(report.photos) && report.photos.length > 0 ? report.photos : []);
                const thumb = photos[0] || '';

                const cardHTML = `
                    <div class="issue-card" style="display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 14px;">
                        <div style="flex: 1; min-width: 0;">
                            <div class="card-header">
                                <div class="card-title">${report.title}</div>
                                <span class="status-badge ${statusClass}">${statusText}</span>
                            </div>
                            <div class="card-meta" style="margin-bottom: 12px;">
                                <span><i class="fas fa-calendar-alt"></i> ${displayDate}</span>
                                <span><i class="fas fa-tag"></i> ${report.category || 'Civic'}</span>
                            </div>
                            <button class="btn-primary" onclick="openDetails('${report._id || report.id}')" style="padding: 8px 14px; font-size: 13px; min-height: 34px; background: white; color: var(--brand); border: 1px solid var(--brand); display: inline-flex; width: auto;">
                                ${isResolved ? 'View Details' : 'Resolve Issue'}
                            </button>
                        </div>
                        ${thumb ? `
                            <div class="issue-card-image-tab" style="width: 76px; height: 76px; border-radius: 10px; overflow: hidden; flex-shrink: 0; border: 1px solid #e2e8f0; background: #f8fafc;">
                                <img src="${thumb}" alt="${report.title}" style="width: 100%; height: 100%; object-fit: cover;" referrerpolicy="no-referrer" onerror="this.parentElement.style.display='none'">
                            </div>
                        ` : ''}
                    </div>
                `;
                grid.insertAdjacentHTML('beforeend', cardHTML);
            });
        }

        function openDetails(issueId) {
            const report = state.issues.find(i => i._id === issueId);
            if (!report) return;

            state.currentIssueId = issueId;
            document.getElementById('modalTitle').textContent = report.title;
            document.getElementById('modalDescription').textContent = report.description;
            document.getElementById('modalDate').textContent = report.createdAt ? new Date(report.createdAt).toLocaleDateString() : 'Recent';
            
            const badge = document.getElementById('modalStatusBadge');
            badge.textContent = report.status.toUpperCase();
            badge.className = `status-badge ${report.status.toLowerCase() === 'resolved' ? 'status-resolved' : 'status-pending'}`;

            const isGov = true; 
            const isPending = report.status.toLowerCase() === 'pending';
            document.getElementById('resolutionSection').style.display = (isGov && isPending) ? 'block' : 'none';

            // ACTIVATE FOCUS MODE
            document.body.classList.add('modal-active');
            document.getElementById('detailsModalOverlay').classList.add('show');
        }

        function closeDetails() {
            // DEACTIVATE FOCUS MODE
            document.body.classList.remove('modal-active');
            document.getElementById('detailsModalOverlay').classList.remove('show');
        }

 async function handleResolveSubmit(e) {
    e.preventDefault();
    
    const submitBtn = e.target.querySelector('button[type="submit"]');
    const originalText = submitBtn.textContent;
    submitBtn.disabled = true;
    submitBtn.textContent = "Uploading...";

    const formData = new FormData();
    formData.append('resolutionDescription', document.getElementById('resolveDesc').value);
    formData.append('resolutionImage', document.getElementById('resolveImage').files[0]);
    formData.append('status', 'resolved');

    try {
        // CRITICAL: Ensure this path matches your backend router EXACTLY
        const res = await fetch(`/api/issues/${state.currentIssueId}/resolve`, {
            method: 'PUT',
            body: formData
            // Note: Do NOT set Content-Type header manually when using FormData; 
            // the browser needs to set the boundary automatically.
        });

        if (res.ok) {
            alert('Success! Issue resolved.');
            location.reload();
        } else {
            // Check if response is JSON before parsing to avoid the SyntaxError '<'
            const contentType = res.headers.get("content-type");
            if (contentType && contentType.includes("application/json")) {
                const errorData = await res.json();
                alert(`Error: ${errorData.message || 'Failed to update issue.'}`);
            } else {
                alert(`Server Error (404): The backend route was not found. Check your server logs.`);
            }
        }
    } catch (err) { 
        console.error("Submission Error:", err);
        alert('Connection error. Is the backend server running?');
    } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = originalText;
    }
}
        function applyFilter(filterType, btnElement) {
            state.activeFilter = filterType;
            document.querySelectorAll('.filter-pill').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
            renderReports(filterType);
        }

        function toggleSideMenu() {
            document.getElementById('sideMenu').classList.toggle('show');
            document.getElementById('sideMenuOverlay').classList.toggle('show');
        }

        function performLogout() {
            try {
                localStorage.removeItem('civicUser');
                localStorage.clear();
                sessionStorage.clear();
            } catch (e) {
                console.warn("Storage clear error during sign out:", e);
            }
            fetch('/api/auth/logout', { method: 'POST' }).catch(() => {});
            window.location.replace('index.html');
        }

        document.addEventListener('DOMContentLoaded', () => {
            if(state.currentUser) {
                document.getElementById('profileName').textContent = state.currentUser.name;
                document.getElementById('menuProfileName').textContent = state.currentUser.name;
                document.getElementById('menuProfileRole').textContent = 'Gov Official';
            }
            fetchIssues();
        });
    </script>
</body>
</html>
