      font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 800;
      font-size: 34px;
      letter-spacing: -0.5px;
    }
  </style>
  <!-- "Loca" Prefix -->
  <text x="4" y="41" class="brand-text">Loca</text>
  
