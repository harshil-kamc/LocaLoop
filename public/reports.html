<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Reports - Localoop</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    
    <link rel="stylesheet" href="dashboard.css">

    <style>
        .reports-container {
            position: absolute;
            top: 100px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 1000px;
            bottom: 30px;
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            border: var(--glass-border);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-float);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            z-index: 10;
        }

        .reports-grid {
            padding: 24px;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        body {
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 20px 20px;
            background-color: #f1f5f9;
        }

        .details-modal {
            background: white;
            padding: 24px;
            border-radius: var(--radius-lg);
            width: 90%;
            max-width: 450px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: var(--shadow-float);
            z-index: 1000;
        }
    </style>
</head>
<body>

    <script>
    (function() {
        const user = JSON.parse(localStorage.getItem('civicUser'));
        if (!user || !user.name || !user.email) {
            window.location.replace('index.html');
        }
    })();
    </script>

    <header class="top-nav">
        <div class="brand">
            <button class="icon-btn" onclick="toggleSideMenu()" style="background: var(--brand); color: white;"><i class="fas fa-bars"></i></button>
            <i class="fas fa-layer-group" style="font-size: 22px;"></i> Localoop
        </div>
        <div class="nav-actions">
            <div class="user-chip">
                <div style="width: 24px; height: 24px; border-radius: 50%; background: var(--brand); color: white; display: flex; align-items: center; justify-content: center; font-size: 10px;"><i class="fas fa-user"></i></div>
                <span id="profileName">Loading...</span>
            </div>
            <button class="icon-btn" onclick="performLogout()" style="color: var(--danger);"><i class="fas fa-power-off"></i></button>
        </div>
    </header>

    <div id="sideMenuOverlay" class="modal-overlay" onclick="toggleSideMenu()"></div>
    <aside class="side-menu" id="sideMenu">
        <div class="panel-header" style="display: flex; justify-content: space-between; align-items: center;">
            <h2 style="margin:0;">Menu</h2>
            <button class="icon-btn" onclick="toggleSideMenu()"><i class="fas fa-times"></i></button>
        </div>
        <div style="padding: 24px; text-align: center; border-bottom: 1px solid rgba(0,0,0,0.05);">
            <div style="width: 64px; height: 64px; border-radius: 50%; background: var(--brand); color: white; display: flex; align-items: center; justify-content: center; font-size: 24px; margin: 0 auto 12px;"><i class="fas fa-user"></i></div>
            <h3 id="menuProfileName" style="margin-bottom: 4px;">Loading...</h3>
            <span class="status-badge status-resolved" id="menuProfileRole">Resident</span>
        </div>
        <div style="padding: 20px;">
            <div class="nav-item" onclick="window.location.href='dashboard.html'"><i class="fas fa-map"></i> Live Map</div>
            <div class="nav-item active" onclick="window.location.href='reports.html'"><i class="fas fa-list-alt"></i> Issues Reported</div>
            <div class="nav-item" onclick="window.location.href='leaderboard.html'"><i class="fas fa-trophy"></i> Leaderboard</div>
            <div class="nav-item" onclick="window.location.href='settings.html'"><i class="fas fa-cog"></i> Settings</div>
        </div>
    </aside>

    <main class="reports-container">
        <div class="panel-header" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px;">
            <div>
                <h2>My Reported Issues</h2>
                <p style="color: var(--text-muted); font-size: 14px;">Track the status of issues you have submitted.</p>
            </div>
            <div class="filter-group">
                <button class="filter-pill active" onclick="applyFilter('all', this)">All</button>
                <button class="filter-pill" onclick="applyFilter('pending', this)">Pending</button>
                <button class="filter-pill" onclick="applyFilter('resolved', this)">Resolved</button>
            </div>
        </div>
        
        <div class="reports-grid" id="myReportsGrid"></div>
    </main>

    <div id="detailsModalOverlay" class="modal-overlay" onclick="closeDetails()">
        <div class="details-modal" onclick="event.stopPropagation()">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                <h3 id="modalTitle" style="margin: 0; font-size: 20px;">Issue Details</h3>
                <button class="icon-btn" onclick="closeDetails()"><i class="fas fa-times"></i></button>
            </div>
            <div style="margin-bottom: 15px;">
                <span id="modalStatusBadge" class="status-badge"></span>
            </div>
            <p style="font-size: 14px; margin-bottom: 8px;"><strong>Date Reported:</strong> <span id="modalDate"></span></p>
            <p style="font-size: 14px; margin-bottom: 15px;"><strong>Description:</strong> <span id="modalDesc"></span></p>
            <p style="font-size: 14px; color: var(--text-muted); padding: 10px; background: #f1f5f9; border-radius: 8px;">
                The local municipality has received your report and it is currently under review.
            </p>
            <button class="btn-primary" style="width: 100%; margin-top: 20px;" onclick="closeDetails()">Close Window</button>
        </div>
    </div>

    <script>
        // --- 1. Global State ---
        let state = {
            currentUser: JSON.parse(localStorage.getItem('civicUser')),
            issues: [],
            activeFilter: 'all'
        };

        // --- 2. Fetch Data from Database ---
        async function fetchIssues() {
            try {
                const response = await fetch('/api/issues');
                if (response.ok) {
                    state.issues = await response.json();
                    renderReports(state.activeFilter);
                }
            } catch (err) {
                console.error("Failed to fetch reports:", err);
            }
        }

        // --- 3. Render Cards Logic ---
        function renderReports(filter = 'all') {
            const grid = document.getElementById('myReportsGrid');
            if (!grid) return;
            
            grid.innerHTML = ''; 

            const user = state.currentUser;
            
            // Filter: Only my reports + category filter
            const myReports = state.issues.filter(report => {
                const isMine = report.reporterEmail === user.email;
                const matchesFilter = (filter === 'all' || report.status.toLowerCase() === filter.toLowerCase());
                return isMine && matchesFilter;
            });

            if (myReports.length === 0) {
                grid.innerHTML = `<p style="color: var(--text-muted); grid-column: 1 / -1; text-align: center; padding: 40px;">No ${filter} issues found.</p>`;
                return;
            }

            myReports.forEach(report => {
                const isResolved = report.status.toLowerCase() === 'resolved';
                const statusClass = isResolved ? 'status-resolved' : 'status-pending';
                const statusText = report.status.charAt(0).toUpperCase() + report.status.slice(1);
                const displayDate = report.createdAt ? new Date(report.createdAt).toLocaleDateString() : 'Recent';

                const cardHTML = `
                    <div class="issue-card">
                        <div class="card-header">
                            <div class="card-title">${report.title}</div>
                            <span class="status-badge ${statusClass}">${statusText}</span>
                        </div>
                        <div class="card-meta" style="margin-bottom: 12px;">
                            <span><i class="fas fa-calendar-alt"></i> ${displayDate}</span>
                            <span><i class="fas fa-exclamation-triangle"></i> ${report.urgency || 'Medium'}</span>
                        </div>
                        <button class="btn-primary" onclick="openDetails('${report._id}')" style="padding: 10px; font-size: 13px; min-height: 36px; background: white; color: var(--brand); border: 1px solid var(--brand); box-shadow: none;">
                            View Details
                        </button>
                    </div>
                `;
                grid.insertAdjacentHTML('beforeend', cardHTML);
            });
        }

        // --- 4. UI Functions ---
        function applyFilter(filterType, btnElement) {
            state.activeFilter = filterType;
            document.querySelectorAll('.filter-pill').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
            renderReports(filterType);
        }

        function openDetails(id) {
            const report = state.issues.find(r => r._id === id);
            if(report) {
                document.getElementById('modalTitle').textContent = report.title;
                document.getElementById('modalDate').textContent = new Date(report.createdAt).toLocaleDateString();
                document.getElementById('modalDesc').textContent = report.description || 'No description provided.';
                
                const badge = document.getElementById('modalStatusBadge');
                badge.textContent = report.status.toUpperCase();
                badge.className = `status-badge ${report.status.toLowerCase() === 'pending' ? 'status-pending' : 'status-resolved'}`;

                document.getElementById('detailsModalOverlay').classList.add('show');
            }
        }

        function closeDetails() {
            document.getElementById('detailsModalOverlay').classList.remove('show');
        }

        function toggleSideMenu() {
            document.getElementById('sideMenu').classList.toggle('show');
            document.getElementById('sideMenuOverlay').classList.toggle('show');
        }

        function performLogout() {
            localStorage.removeItem('civicUser');
            window.location.href = 'index.html';
        }

        // --- 5. Initialization ---
        document.addEventListener('DOMContentLoaded', () => {
            if(state.currentUser) {
                document.getElementById('profileName').textContent = state.currentUser.name;
                document.getElementById('menuProfileName').textContent = state.currentUser.name;
                document.getElementById('menuProfileRole').textContent = state.currentUser.role || 'Resident';
            }
            fetchIssues(); // Initial DB call
        });
    </script>
</body>
</html>
